<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="推测解码方法的论文原文摘录、中文翻译、机制解释与 training / training-free 判定。">
    <title>方法摘要｜推测解码论文地图</title>
    <style>
      :root { --ink:#18212d; --muted:#66717f; --line:#d7dce1; --blue:#236e8e; --paper:#f4f5f6; --panel:#fff; --green:#27664e; --orange:#8b4e24; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif; line-height:1.7; }
      .page { width:min(1020px,calc(100% - 32px)); margin:0 auto; padding:34px 0 64px; }
      header { padding:28px 32px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
      .eyebrow { margin:0 0 6px; color:var(--blue); font-size:.72rem; font-weight:800; letter-spacing:.12em; }
      h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,2.8rem); line-height:1.2; }
      .lead { margin:0; color:var(--muted); }
      #content { margin-top:18px; padding:30px 34px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
      #content h2 { margin:38px 0 10px; padding-top:22px; border-top:1px solid var(--line); font-size:1.45rem; line-height:1.3; }
      #content h2:first-of-type { margin-top:0; padding-top:0; border-top:0; }
      #content h3 { margin:24px 0 8px; font-size:1.1rem; }
      #content p { margin:10px 0; }
      #content blockquote { margin:16px 0; padding:13px 17px; border-left:4px solid var(--blue); color:#43505d; background:#f1f6f8; }
      #content code { padding:2px 5px; border-radius:3px; color:#8b4e24; background:#f9e7d8; font-size:.9em; }
      #content table { width:100%; margin:14px 0 20px; border-collapse:collapse; font-size:.92rem; }
      #content th, #content td { padding:8px 10px; border:1px solid var(--line); text-align:left; vertical-align:top; }
      #content th { background:#f3f5f6; }
      #content a { color:var(--blue); }
      .training { display:inline-block; margin:4px 0 8px; padding:3px 8px; border-radius:4px; font-size:.74rem; font-weight:800; letter-spacing:.03em; }
      .training.required { color:var(--orange); background:#f9e7d8; }
      .training.free { color:var(--green); background:#e1f1e9; }
      .back { display:inline-block; margin-top:18px; color:var(--blue); font-weight:700; text-decoration:none; }
      .error { color:#9b3f3f; }
      @media (max-width:680px) { .page { width:min(100% - 18px,1020px); padding-top:12px; } header,#content { padding:20px 18px; } #content { overflow-x:auto; } #content table { min-width:620px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">PAPER READING NOTES · HTTPS RENDERED</p>
        <h1>方法摘要：原文摘录、翻译与解释</h1>
        <p class="lead">逐篇阅读八种推测解码方法，并明确区分需要训练的 drafter 与无需新增训练的 inference-time 扩展。</p>
        <a class="back" href="index.html">← 返回方法依赖图</a>
      </header>
      <article id="content"><p>正在加载摘要…</p></article>
    </main>
    <script>
      const content = document.querySelector("#content");
      const escapeHtml = (value) => value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = (value) => escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      const slug = (value) => value.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, "-").replace(/^-|-$/g, "");
      const closeParagraph = (html) => html ? `${html}</p>` : "";
      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r/g, "").split("\n");
        let html = "", paragraph = "", list = false, index = 0;
        const flush = () => { html += closeParagraph(paragraph); paragraph = ""; if (list) { html += "</ul>"; list = false; } };
        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) { flush(); index += 1; continue; }
          if (line.trim().startsWith("<a id=")) { flush(); html += line.trim(); index += 1; continue; }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { flush(); const level = heading[1].length; const text = inline(heading[2]); const id = slug(heading[2]); html += `<h${level} id="${id}">${text}</h${level}>`; index += 1; continue; }
          if (line.startsWith("> ")) { flush(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; index += 1; continue; }
          if (line.startsWith("- ")) { if (!list) { flush(); html += "<ul>"; list = true; } html += `<li>${inline(line.slice(2))}</li>`; index += 1; continue; }
          if (line.startsWith("|")) {
            flush(); const rows = [];
            while (index < lines.length && lines[index].startsWith("|")) { const cells = lines[index].split("|").slice(1, -1).map((cell) => cell.trim()); if (!cells.every((cell) => /^[-:]+$/.test(cell))) rows.push(cells); index += 1; }
            if (rows.length) { html += `<table><thead><tr>${rows[0].map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table>`; }
            continue;
          }
          if (!paragraph) paragraph = "<p>";
          else paragraph += " ";
          paragraph += inline(line);
          index += 1;
        }
        flush();
        content.innerHTML = html;
        content.querySelectorAll("h2").forEach((heading) => { if (/training|training-free/.test(heading.textContent)) return; });
      }
      fetch("method_summaries.md").then((response) => { if (!response.ok) throw new Error("摘要文件加载失败"); return response.text(); }).then(renderMarkdown).catch((error) => { content.innerHTML = `<p class="error">${error.message}。请直接打开 <a href="method_summaries.md">Markdown 原文</a>。</p>`; });
    </script>
  </body>
</html>
