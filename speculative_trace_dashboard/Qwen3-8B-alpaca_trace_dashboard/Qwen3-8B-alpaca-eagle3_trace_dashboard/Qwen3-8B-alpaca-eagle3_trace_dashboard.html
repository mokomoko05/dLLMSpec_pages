function treeSvg(t){const ids=arr(t.tree_token_ids),texts=arr(t.tree_token_text),pieces=arr(t.tree_token_piece),depths=arr(t.depth),parents=arr(t.parents),accepted=new Set(arr(t.accepted_node_indices).map(Number));if(!ids.length)return'';const byDepth={};depths.forEach((d,i)=>(byDepth[d]??=[]).push(i));const pos={};Object.entries(byDepth).forEach(([d,nodes])=>nodes.forEach((n,j)=>pos[n]={x:68+num(d)*170,y:38+j*52}));const height=Math.max(110,...Object.values(pos).map(p=>p.y+38)),width=Math.max(900,136+Math.max(0,...depths.map(Number))*170);let edges=parents.map((p,i)=>p>=0&&pos[p]&&pos[i]?`<line class="tree-edge ${accepted.has(i)&&accepted.has(p)?'accepted':''}" x1="${pos[p].x+51}" y1="${pos[p].y}" x2="${pos[i].x-51}" y2="${pos[i].y}"/>`:'').join('');let nodes=ids.map((id,i)=>pos[i]?`<g><title>token id ${esc(id)} · piece ${esc(pieces[i]??'')}</title><rect class="tree-node ${accepted.has(i)?'accepted':''}" x="${pos[i].x-50}" y="${pos[i].y-20}" width="100" height="40" rx="4"/><text class="tree-label" text-anchor="middle" x="${pos[i].x}" y="${pos[i].y-1}">${prettyToken(texts,ids,i)}</text><text class="tree-id" text-anchor="middle" x="${pos[i].x}" y="${pos[i].y+12}">id ${esc(id)}</text></g>`:'').join('');return`<div class="panel"><div class="panel-head"><h2>EAGLE tree</h2><span class="meta">green path = committed candidate</span></div><div class="panel-body"><svg class="tree-canvas" width="100%" height="${height}" viewBox="0 0 ${width} ${height}">${edges}${nodes}</svg></div></div>`}
function comparisonRuns(){const order=algorithms();return Object.entries(runs).map(([runId,meta])=>({runId,meta,summary:meta.trace_summary||{},draft:meta.draft_model_info||{},profile:meta.algorithm_profile||{}})).filter(row=>num(row.summary.verify_steps)>0).sort((a,b)=>order.indexOf(a.meta.algorithm)-order.indexOf(b.meta.algorithm))}
function histogram(rows){const maxAccepted=Math.max(0,...rows.flatMap(row=>arr(row.summary.acceptance_histogram).map(item=>num(item.accepted)))),maxCount=Math.max(1,...rows.flatMap(row=>arr(row.summary.acceptance_histogram).map(item=>num(item.count))));return`<div class="histogram">${rows.map(row=>{const counts=new Map(arr(row.summary.acceptance_histogram).map(item=>[num(item.accepted),num(item.count)]));const bars=Array.from({length:maxAccepted+1},(_,accepted)=>{const count=counts.get(accepted)||0,height=count?Math.max(3,Math.round(count/maxCount*48)):0;return`<div class="hist-bar ${esc(row.meta.algorithm)}" style="height:${height}px" title="${esc(row.meta.algorithm)}: ${count} rounds accepted ${accepted} draft tokens"><span class="hist-bar-label">${accepted}</span></div>`}).join('');return`<div class="hist-row"><span class="badge ${esc(row.meta.algorithm)}">${esc(row.meta.algorithm)}</span><div class="hist-bars">${bars}</div></div>`}).join('')}</div>`}
function checkpointBreakdown(rows){
  const cards=rows.map(row=>{
    const algorithm=String(row.meta.algorithm??'unknown'),components=arr(row.draft.checkpoint_components),total=num(row.draft.num_parameters);
    const componentRows=components.map(component=>{
      const targetCopy=algorithm==='dspark'&&(component.key==='input_embedding'||component.key==='lm_head');
      const copyLabel=targetCopy?'<span class="target-copy-label">target copy</span>':'';
      const componentNote=targetCopy?`${component.note} Copied from the target and frozen during DSpark training.`:component.note;
      return`<tr class="${targetCopy?'target-copy':''}"><td>${esc(component.label)}${copyLabel}</td><td>${integerNumber(component.num_parameters)}</td><td>${bytes(component.payload_bytes)}</td><td>${percent(total?num(component.num_parameters)/total:0)}</td><td class="component-note">${esc(componentNote??'')}</td></tr>`;
    }).join('');
    let callout='Component-level detail is unavailable for this checkpoint format.';
    let calloutClass='';
    if(algorithm==='dspark'&&components.length){
      const formula=components.map(component=>`${integerNumber(component.num_parameters)} ${String(component.label).toLowerCase()}`).join(' + ');
      callout=`DSpark ${integerNumber(total)} serialized parameters = ${formula}. Input embedding and LM head are separate copies taken from the target and frozen during training; the official evaluator loads both copies in addition to the target model.`;
      calloutClass=' important';
    }else if(algorithm==='dflash'){
      callout='DFlash does not serialize an input embedding or LM head in its draft checkpoint; official inference reuses both tensors from the target model.';
    }
    const body=components.length?`<table><thead><tr><th>Component</th><th>Parameters</th><th>Tensor payload</th><th>Share</th><th>Role</th></tr></thead><tbody>${componentRows}</tbody></table>`:`<div class="component-callout">${esc(callout)}</div>`;
    const footer=components.length?`<div class="component-callout${calloutClass}">${esc(callout)}</div>`:'';
    return`<article class="checkpoint-card ${esc(algorithm)}"><div class="checkpoint-card-head"><span class="badge ${esc(algorithm)}">${esc(algorithm)}</span><strong>${compactNumber(total)} · ${bytes(row.draft.checkpoint_bytes)}</strong></div>${body}${footer}</article>`;
  }).join('');
  return`<div class="checkpoint-grid">${cards}</div>`;
}
function renderSummary(){
  const rows=comparisonRuns();
  if(!rows.length){main.innerHTML='<div class="empty">No run summaries available.</div>';return}
  const bestAcceptance=Math.max(...rows.map(row=>num(row.summary.avg_acceptance_length))),dataset=datasetLabel(rows[0].meta.prompt_dataset),sample=rows[0].meta.prompt_sample_index??rows[0].meta.dataset_sample_index??'?';
  const cards=rows.map(row=>`<article class="method-card ${esc(row.meta.algorithm)}" data-open-run="${esc(row.runId)}"><span class="badge ${esc(row.meta.algorithm)}">${esc(row.meta.algorithm)}</span><h3>${esc(row.profile.topology??row.meta.algorithm)}</h3><div class="model-name">${esc(row.draft.name??row.meta.draft_model)}</div><div class="method-metrics"><div class="method-metric"><strong>${fixed(row.summary.avg_acceptance_length)}</strong><span>Avg acceptance length</span></div><div class="method-metric"><strong>${percent(row.summary.draft_token_acceptance_rate)}</strong><span>Draft-token accepted</span></div><div class="method-metric"><strong>${row.summary.verify_steps}</strong><span>Verify rounds</span></div><div class="method-metric"><strong>${compactNumber(row.draft.num_parameters)}</strong><span>Checkpoint params</span></div></div></article>`).join('');
  const tableRows=rows.map(row=>`<tr data-open-run="${esc(row.runId)}"><td><span class="badge ${esc(row.meta.algorithm)}">${esc(row.meta.algorithm)}</span></td><td>${esc(row.draft.architecture??'unknown')}<br><span class="meta">${esc(row.draft.num_layers??'?')} layers · ${esc(compactNumber(row.draft.num_parameters))}</span></td><td>${esc(row.profile.proposal_shape??'')}</td><td>${row.summary.verify_steps}</td><td>${fixed(row.summary.avg_proposal_length)}</td><td>${fixed(row.summary.avg_accepted_draft)}</td><td class="${num(row.summary.avg_acceptance_length)===bestAcceptance?'best':''}">${fixed(row.summary.avg_acceptance_length)}</td><td>${percent(row.summary.draft_token_acceptance_rate)}</td><td>${row.summary.generated_tokens}</td></tr>`).join('');
  const mechanics=rows.map(row=>`<div class="mechanic ${esc(row.meta.algorithm)}"><strong>${esc(row.meta.algorithm.toUpperCase())} · ${esc(row.profile.topology??row.meta.algorithm)}</strong><span>${esc(row.profile.draft_dependency??'')}</span><span>${esc(row.profile.sampling??'')}</span></div>`).join('');
  main.innerHTML=`<section class="summary-intro"><h2>Three-method trace comparison</h2><p>${esc(dataset)} sample ${esc(sample)} · observed request-level behavior from the embedded DFlash, DSpark, and EAGLE-3 traces. Click a method card or table row to open its step explorer.</p></section><section class="summary-cards">${cards}</section><div class="panel"><div class="panel-head"><h2>Observed trace metrics</h2><span class="meta">average acceptance length = committed tokens / verify rounds</span></div><div class="panel-body"><table class="comparison-table"><thead><tr><th>Method</th><th>Draft model</th><th>Proposal structure</th><th>Rounds</th><th>Avg proposal</th><th>Avg accepted draft</th><th>Avg acceptance length</th><th>Draft-token acceptance</th><th>Generated</th></tr></thead><tbody>${tableRows}</tbody></table><div class="summary-note">Checkpoint totals count serialized tensors, not a normalized drafter core. The composition panel distinguishes DSpark's target-weight copies from its draft backbone and algorithm-specific heads. These single-request traces explain behavior; they are not throughput benchmarks.</div></div></div><div class="panel"><div class="panel-head"><h2>Draft checkpoint composition</h2><span class="meta">component payload excludes the small checkpoint metadata header</span></div><div class="panel-body">${checkpointBreakdown(rows)}</div></div><section class="summary-grid"><div class="panel"><div class="panel-head"><h2>Acceptance distribution</h2><span class="meta">x-axis = accepted draft tokens in one verify round</span></div><div class="panel-body">${histogram(rows)}</div></div><div class="panel"><div class="panel-head"><h2>Algorithmic difference</h2></div><div class="panel-body"><div class="mechanics-list">${mechanics}</div></div></div></section>`;
  main.querySelectorAll('[data-open-run]').forEach(element=>element.addEventListener('click',()=>openRun(element.dataset.openRun)));
}
function setView(nextView){view=nextView;layout.classList.toggle('summary-mode',view==='summary');summaryTab.classList.toggle('active',view==='summary');explorerTab.classList.toggle('active',view==='explorer');render()}
function openRun(runId){const meta=runs[runId]||{};view='explorer';layout.classList.remove('summary-mode');summaryTab.classList.remove('active');explorerTab.classList.add('active');algSel.value=meta.algorithm;const ids=[...new Set(events.filter(event=>(event.algorithm||'unknown')===meta.algorithm).map(event=>event.run_id))];fillSelect(runSel,ids,runId);runSel.value=runId;index=0;resetSteps()}
function scrollTimelineToActive(){const active=main.querySelector('.timeline .bar-wrap.active'),scroller=active?.closest('.panel-body');if(!active||!scroller)return;const activeRect=active.getBoundingClientRect(),scrollerRect=scroller.getBoundingClientRect();if(activeRect.left>=scrollerRect.left&&activeRect.right<=scrollerRect.right)return;const delta=activeRect.left+activeRect.width/2-scrollerRect.left-scroller.clientWidth/2;scroller.scrollLeft=Math.max(0,scroller.scrollLeft+delta)}
function render(){document.getElementById('headerCount').textContent=`${events.length} events · ${algorithms().length} algorithms`;if(view==='summary'){renderSummary();return}document.getElementById('stepReadout').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';renderMeta();if(!filtered.length){main.innerHTML='<div class="empty">No trace events found for this selection.</div>';return}const e=filtered[index],d=e.draft||{},v=e.verify||{},proposal=num(d.proposal_length),accepted=num(v.accepted_draft_tokens),committed=num(v.committed_token_count,arr(v.committed_tokens).length),ratio=proposal?accepted/proposal:0;main.innerHTML=`
<div class="kpis"><div class="kpi"><div class="name">Step</div><div class="value">${esc(e.step)}</div></div><div class="kpi"><div class="name">Context before</div><div class="value">${num(e.context_length_before)}</div></div><div class="kpi"><div class="name">Draft length</div><div class="value">${proposal}</div></div><div class="kpi"><div class="name">Accepted draft</div><div class="value">${accepted}</div></div><div class="kpi"><div class="name">Acceptance</div><div class="value">${(ratio*100).toFixed(0)}%</div></div></div>
${generationPanel()}
<div class="panel"><div class="panel-head"><h2>Acceptance timeline</h2><span class="badge ${esc(e.algorithm)}">${esc(e.algorithm)}</span></div><div class="panel-body">${timeline()}</div></div>
<div class="panel"><div class="panel-head"><h2>Draft proposal</h2><span class="meta">${accepted}/${proposal} accepted · ${committed} committed</span></div><div class="panel-body"><div class="token-strip">${tokenStrip(e)}</div></div></div>
<div class="panel"><div class="panel-head"><h2>Target verification</h2><span class="meta">next / bonus / residual: ${esc(v.bonus_or_residual_token??v.next_token??'none')}</span></div><div class="panel-body">${verificationTable(e)}</div></div>
${e.algorithm==='eagle3'?eaglePaths(e):''}
<div class="panel"><div class="panel-head"><h2>Cache and raw event</h2><span class="meta">target ${esc(e.cache?.target_seq_len_before??'?')} → ${esc(e.cache?.target_seq_len_after??'?')}</span></div><div class="panel-body"><details><summary>Show JSON</summary><pre>${esc(JSON.stringify(e,null,2))}</pre></details></div></div>`;
const streamElement=main.querySelector('.generation-stream');if(streamElement)streamElement.scrollTop=streamElement.scrollHeight;scrollTimelineToActive();main.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{index=num(el.dataset.step);stepRange.value=index;render()}))}
algSel.addEventListener('change',()=>{index=0;resetRuns()});runSel.addEventListener('change',()=>{index=0;resetSteps()});stepRange.addEventListener('input',()=>{index=num(stepRange.value);render()});document.getElementById('prevStep').addEventListener('click',()=>{index=Math.max(0,index-1);stepRange.value=index;render()});document.getElementById('nextStep').addEventListener('click',()=>{index=Math.min(filtered.length-1,index+1);stepRange.value=index;render()});summaryTab.addEventListener('click',()=>setView('summary'));explorerTab.addEventListener('click',()=>setView('explorer'));document.addEventListener('keydown',e=>{if(view!=='explorer')return;if(e.key==='ArrowLeft')document.getElementById('prevStep').click();if(e.key==='ArrowRight')document.getElementById('nextStep').click()});
const hasComparison=algorithms().length>1;summaryTab.hidden=!hasComparison;view=hasComparison?'summary':'explorer';layout.classList.toggle('summary-mode',view==='summary');summaryTab.classList.toggle('active',view==='summary');explorerTab.classList.toggle('active',view==='explorer');fillSelect(algSel,algorithms(),algorithms()[0]);resetRuns();
</script>
</body></html>
